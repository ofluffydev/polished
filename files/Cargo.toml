[package]
description = "File loading and (future) filesystem abstraction for Polished OS, supporting UEFI and no_std environments."
edition = "2024"
license = "Zlib"
name = "polished_files"
readme = "./README.md"
repository = "https://codeberg.org/ofluffydev/polished"
version = "0.1.1"

[lib]
crate-type = ["rlib"]

[features]
uefi = ["dep:uefi", "dep:polished_graphics"]

default = []

[dependencies]
polished_graphics = { version = "0.1.1", optional = true, path = "../graphics", default-features = false }
uefi = { version = "0.35.0", optional = true, default-features = false, features = [
  "alloc",
  "logger",
] }
